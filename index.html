function asDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}$('exportBtn').onclick=async()=>{const p=current();if(!p)return;try{const images={};for(const r of p.trees)for(const id of r.photos||[]){const b=await getImage(id);if(!b)throw Error('Не найдено изображение '+id);images[id]=await asDataURL(b)}const file=new Blob([JSON.stringify({version:1,plan:p,images},null,2)],{type:'application/json'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=p.name.replace(/[\\/:*?"<>|]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('План экспортирован')}catch(e){notify('Ошибка экспорта: '+e.message)}};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;const created=[];try{const data=JSON.parse(await file.text()),p=data.plan;if(data.version!==1||!p||typeof p.name!=='string'||!p.name.trim()||!Number.isInteger(p.difficulty)||p.difficulty<1||p.difficulty>5||!['items','skills','trees'].every(k=>Array.isArray(p[k])))throw Error('Неверный формат плана');const newPlan={id:uid(),name:p.name,difficulty:p.difficulty,items:[],skills:[],trees:[]};for(const k of ['items','skills','trees'])for(const r of p[k]){if(!r||!Number.isFinite(r.level)||!acts.includes(r.act))throw Error('Некорректная запись');let n={id:uid(),level:r.level,act:r.act};if(k==='items')Object.assign(n,{type:String(r.type||''),regex:String(r.regex||''),trade:String(r.trade||''),old:!!r.old});if(k==='skills')Object.assign(n,{name:String(r.name||''),en:String(r.en||''),gem:Number(r.gem)||1,priority:Number.isFinite(r.priority)?r.priority:100,supports:Array.from({length:5},(_,i)=>String(r.supports?.[i]||''))});if(k==='trees'){n.comment=String(r.comment||'');n.photos=[];for(const old of r.photos||[]){const src=data.images?.[old];if(typeof src!=='string'||!/^data:image\/[\w.+-]+;base64,/.test(src))throw Error('Некорректное изображение');const b=await(await fetch(src)).blob(),id=uid();await putImage(id,b);created.push(id);n.photos.push(id)}}newPlan[k].push(n)}const previous=state.active;state.plans.push(newPlan);state.active=newPlan.id;if(!persist()){state.plans.pop();state.active=previous;throw Error('Не удалось сохранить план')}render();notify('План импортирован')}catch(err){for(const id of created)try{await delImage(id)}catch{}notify('Ошибка импорта: '+err.message)}};
if(!['items','skills','trees'].includes(state.tab))state.tab='items';if(!current())state.active=state.plans[0]?.id||null;render();if(storageError)notify(storageError);dbPromise.catch(()=>notify('IndexedDB недоступна: изображения не сохранятся'));
</script></body></html>
